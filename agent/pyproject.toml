[project]
name = "cadence-agent"
version = "0.1.0"
description = "Cadence — competitive intel brief crew, served over AG-UI"
requires-python = ">=3.10,<3.14"
dependencies = [
    "ag-ui-crewai==0.3.0",
    "crewai>=1.15.15,<2",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-dotenv>=1.0",
]

[project.scripts]
dev = "cadence.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadence"]
